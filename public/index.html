<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Connect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #131722;
      color: #d1d4dc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef5350;
    }

    header .dot.connected { background: #26a69a; }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .chart-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .symbol-bar {
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 8px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .symbol-bar input {
      background: #2a2e39;
      border: 1px solid #363a45;
      color: #d1d4dc;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      width: 140px;
    }

    .symbol-bar input:focus {
      outline: none;
      border-color: #2962ff;
    }

    .symbol-bar select {
      background: #2a2e39;
      border: 1px solid #363a45;
      color: #d1d4dc;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
    }

    .symbol-bar button {
      background: #2962ff;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .symbol-bar button:hover { background: #1e53e5; }

    #tv-chart {
      flex: 1;
    }

    .alerts-panel {
      width: 320px;
      background: #1e222d;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
    }

    .alerts-panel h2 {
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2e39;
      color: #fff;
    }

    .webhook-info {
      padding: 10px 16px;
      background: #131722;
      border-bottom: 1px solid #2a2e39;
      font-size: 12px;
      color: #787b86;
    }

    .webhook-info code {
      color: #2962ff;
      word-break: break-all;
    }

    #alert-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .alert-item {
      background: #131722;
      border: 1px solid #2a2e39;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 6px;
      font-size: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .alert-item .alert-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .alert-item .ticker {
      font-weight: 700;
      color: #fff;
      font-size: 13px;
    }

    .alert-item .time {
      color: #787b86;
      font-size: 11px;
    }

    .alert-item .action-buy  { color: #26a69a; font-weight: 600; }
    .alert-item .action-sell { color: #ef5350; font-weight: 600; }
    .alert-item .action-other { color: #f7a600; font-weight: 600; }

    .alert-item .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .alert-item .field {
      color: #787b86;
    }

    .alert-item .field span {
      color: #d1d4dc;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #787b86;
      font-size: 13px;
    }

    .empty-state p:first-child {
      font-size: 24px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="dot" id="status-dot"></div>
  <h1>TradingView Connect</h1>
</header>

<div class="layout">
  <div class="chart-panel">
    <div class="symbol-bar">
      <input id="symbol-input" type="text" value="NASDAQ:AAPL" placeholder="NASDAQ:AAPL" />
      <select id="interval-select">
        <option value="1">1m</option>
        <option value="5">5m</option>
        <option value="15">15m</option>
        <option value="60">1h</option>
        <option value="D" selected>1D</option>
        <option value="W">1W</option>
      </select>
      <button onclick="loadChart()">Load</button>
    </div>
    <!-- TradingView Advanced Chart Widget -->
    <div id="tv-chart">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div id="tradingview_chart" style="height:calc(100% - 32px);width:100%"></div>
        <div class="tradingview-widget-copyright">
          <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">
            <span class="blue-text">Track all markets on TradingView</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="alerts-panel">
    <h2>Webhook Alerts</h2>
    <div class="webhook-info">
      Set your TradingView alert webhook URL to:<br/>
      <code id="webhook-url"></code>
    </div>
    <div id="alert-list">
      <div class="empty-state">
        <p>📡</p>
        <p>No alerts yet.</p>
        <p>Configure a TradingView alert to send webhooks here.</p>
      </div>
    </div>
  </div>
</div>

<!-- TradingView Widget Script -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
  let widget = null;

  function loadChart() {
    const symbol = document.getElementById('symbol-input').value.trim() || 'NASDAQ:AAPL';
    const interval = document.getElementById('interval-select').value;

    if (widget) {
      widget.remove();
    }

    widget = new TradingView.widget({
      container_id: 'tradingview_chart',
      width: '100%',
      height: '100%',
      symbol: symbol,
      interval: interval,
      timezone: 'Etc/UTC',
      theme: 'dark',
      style: '1',
      locale: 'en',
      toolbar_bg: '#1e222d',
      enable_publishing: false,
      allow_symbol_change: true,
      save_image: false,
      studies: [],
      show_popup_button: true,
      popup_width: '1000',
      popup_height: '650',
    });
  }

  // Show webhook URL
  const webhookUrl = `${location.origin}/webhook`;
  document.getElementById('webhook-url').textContent = webhookUrl;

  // Poll for new alerts every 3 seconds
  let lastCount = 0;

  async function fetchAlerts() {
    try {
      const res = await fetch('/alerts');
      const data = await res.json();

      const dot = document.getElementById('status-dot');
      dot.classList.add('connected');

      if (data.length !== lastCount) {
        lastCount = data.length;
        renderAlerts(data);
      }
    } catch (e) {
      document.getElementById('status-dot').classList.remove('connected');
    }
  }

  function renderAlerts(data) {
    const list = document.getElementById('alert-list');

    if (data.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <p>📡</p>
          <p>No alerts yet.</p>
          <p>Configure a TradingView alert to send webhooks here.</p>
        </div>`;
      return;
    }

    list.innerHTML = data.map(a => {
      const action = (a.action || '').toLowerCase();
      const actionClass = action === 'buy' ? 'action-buy'
                        : action === 'sell' ? 'action-sell'
                        : 'action-other';

      const time = a.time || a.receivedAt || '';
      const displayTime = time ? new Date(time).toLocaleTimeString() : '';

      const fields = Object.entries(a)
        .filter(([k]) => !['ticker', 'action', 'time', 'receivedAt'].includes(k))
        .map(([k, v]) => `<div class="field">${k}: <span>${v}</span></div>`)
        .join('');

      return `
        <div class="alert-item">
          <div class="alert-header">
            <span class="ticker">${a.ticker || 'ALERT'}</span>
            <span class="time">${displayTime}</span>
          </div>
          ${action ? `<div class="${actionClass}" style="margin-bottom:4px">${action.toUpperCase()}</div>` : ''}
          <div class="fields">${fields}</div>
        </div>`;
    }).join('');
  }

  // Load chart and start polling on page load
  loadChart();
  fetchAlerts();
  setInterval(fetchAlerts, 3000);
</script>

</body>
</html>
